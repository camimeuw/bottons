<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Nombre de tu proyecto</title>
  <style>:root{--page-bg:#0a0a0a;}</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="thin-logo">
      <feMorphology operator="erode" radius="0.28"></feMorphology>
    </filter>
  </defs>
</svg>

 <section class="hero">
  <div class="hero-video-frame">
    <video class="hero-char-video" autoplay muted loop playsinline>
      <source src="assets/video/hero-character.mp4" type="video/mp4">
    </video>
    <div class="vhs-overlay"></div>
    <div class="grain-overlay"></div>
  </div>

  <div class="hero-menu">
    <h1 class="hero-logo">Buttons</h1>
    <nav class="start-menu">
      <a href="tienda.html" class="menu-item">Entrar</a>
      <a href="tienda.html?carrito=1" class="menu-item">Continuar</a>
      <a href="politicas.html" class="menu-item">Políticas</a>
      <a href="https://wa.me/595981751066" class="menu-item" target="_blank" rel="noopener">Contacto</a>
    </nav>
    <p class="hero-date">— presioná una opción —</p>
  </div>

  <audio id="bg-music" loop preload="none">
    <source src="assets/audio/bg-music.mp3" type="audio/mpeg">
  </audio>

  <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Activar música" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
      <path class="sound-wave" d="M16.5 8.5a5 5 0 0 1 0 7"></path>
      <path class="sound-wave" d="M19 6a9 9 0 0 1 0 12"></path>
      <line class="sound-mute" x1="16" y1="7" x2="21" y2="17"></line>
    </svg>
  </button>
</section>

  <!-- Página de inicio únicamente -->

  <script>
    const music = document.getElementById('bg-music');
    const toggle = document.getElementById('sound-toggle');
    toggle.addEventListener('click', () => {
      const playing = !music.paused;
      if (playing) {
        music.pause();
      } else {
        music.play().catch(() => {});
      }
      toggle.classList.toggle('is-playing', !playing);
      toggle.setAttribute('aria-pressed', String(!playing));
      toggle.setAttribute('aria-label', playing ? 'Activar música' : 'Silenciar música');
    });

    // Detener la música siempre al salir de esta página (navegación o bfcache)
    window.addEventListener('pagehide', () => {
      music.pause();
      music.currentTime = 0;
    });
  </script>
  <script src="transitions.js"></script>

</body>
</html>
