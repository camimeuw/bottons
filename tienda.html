<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons — Tienda</title>
  <style>html,body{background:#4a2e45;}</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tienda.css">
</head>
<body class="tienda-body">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="thin-logo">
      <feMorphology operator="erode" radius="0.28"></feMorphology>
    </filter>
  </defs>
</svg>

<button id="carrito-btn" class="carrito-btn" type="button" aria-label="Ver carrito">
  <img src="assets/img/carrito-boton.png" alt="">
  <span class="carrito-count">2</span>
</button>

<div id="carrito-overlay" class="carrito-overlay"></div>

<aside id="carrito-panel" class="carrito-panel">
  <div class="carrito-panel-header">
    <h2 class="carrito-titulo">Tu Carrito</h2>
    <button id="carrito-close" class="carrito-close" type="button" aria-label="Cerrar carrito">✕</button>
  </div>

  <div class="carrito-items">
    <div class="carrito-item">
      <div class="carrito-item-img" style="background:#8a5a7a;"></div>
      <div class="carrito-item-info">
        <p class="carrito-item-nombre">Top ejemplo Y2K</p>
        <p class="carrito-item-detalle">Talle M</p>
      </div>
      <p class="carrito-item-precio">$8.000</p>
    </div>
    <div class="carrito-item">
      <div class="carrito-item-img" style="background:#5a3a52;"></div>
      <div class="carrito-item-info">
        <p class="carrito-item-nombre">Campera vintage</p>
        <p class="carrito-item-detalle">Talle S</p>
      </div>
      <p class="carrito-item-precio">$15.000</p>
    </div>
  </div>

  <div class="carrito-footer">
    <div class="carrito-total">
      <span>Total</span>
      <span>$23.000</span>
    </div>
    <a href="#" class="carrito-checkout">Finalizar Pedido</a>
  </div>
</aside>

<section class="tienda-cover">
  <img src="assets/img/tienda-portada.jpg" alt="Buttons">
  <h1 class="tienda-logo">Buttons</h1>
</section>

<main class="tienda-main">
  <nav class="cat-tabs" id="cat-tabs"></nav>
  <div class="subcat-chips" id="subcat-chips"></div>
  <div class="productos-grid" id="productos-grid">
    <p class="productos-empty">Elegí una categoría para ver las prendas ✦</p>
  </div>
</main>

<script src="tienda.js"></script>
<script src="transitions.js"></script>

</body>
</html>
