<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons — Tienda</title>
  <style>html,body{background:#4a2e45;}</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tienda.css">
</head>
<body class="tienda-body">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="thin-logo">
      <feMorphology operator="erode" radius="0.28"></feMorphology>
    </filter>
  </defs>
</svg>

<button id="carrito-btn" class="carrito-btn" type="button" aria-label="Ver carrito">
  <img src="assets/img/carrito-boton.png" alt="">
  <span class="carrito-count">2</span>
</button>

<div id="carrito-overlay" class="carrito-overlay"></div>

<aside id="carrito-panel" class="carrito-panel">
  <div class="carrito-panel-header">
    <img src="assets/img/carrito-boton.png" alt="Tu Carrito" class="carrito-titulo-img">
    <button id="carrito-close" class="carrito-close" type="button" aria-label="Cerrar carrito">✕</button>
  </div>

  <div class="carrito-items">
    <div class="carrito-item">
      <div class="carrito-item-img" style="background:#8a5a7a;"></div>
      <div class="carrito-item-info">
        <p class="carrito-item-nombre">Top ejemplo Y2K</p>
        <p class="carrito-item-detalle">Talle M</p>
      </div>
      <p class="carrito-item-precio">$8.000</p>
    </div>
    <div class="carrito-item">
      <div class="carrito-item-img" style="background:#5a3a52;"></div>
      <div class="carrito-item-info">
        <p class="carrito-item-nombre">Campera vintage</p>
        <p class="carrito-item-detalle">Talle S</p>
      </div>
      <p class="carrito-item-precio">$15.000</p>
    </div>
  </div>

  <div class="carrito-footer">
    <div class="carrito-total">
      <span>Total</span>
      <span>$23.000</span>
    </div>
    <a href="#" class="carrito-checkout">Finalizar Pedido</a>
  </div>
</aside>

<section class="tienda-cover">
  <img src="assets/img/tienda-portada.jpg" alt="Buttons">
  <h1 class="tienda-logo">Buttons</h1>
</section>

<main class="tienda-main">
  <button id="cat-menu-toggle" class="cat-menu-toggle" type="button" aria-expanded="false" aria-controls="cat-tabs-wrapper">
    <svg class="cat-menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M4 12c2-3 4-3 6 0s4 3 6 0"></path>
    </svg>
    <span class="cat-menu-label">Categorías</span>
    <svg class="cat-menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M4 12c2-3 4-3 6 0s4 3 6 0"></path>
    </svg>
  </button>

  <div id="cat-tabs-wrapper" class="cat-tabs-wrapper">
    <nav class="cat-tabs" id="cat-tabs"></nav>
  </div>

  <div class="subcat-chips" id="subcat-chips"></div>
  <div class="productos-grid" id="productos-grid">
    <p class="productos-empty">Elegí una categoría para ver las prendas ✦</p>
  </div>
</main>

<section class="galeria">
  <h2 class="galeria-titulo">Destacados</h2>
  <div class="galeria-viewport">
    <div class="galeria-track" id="galeria-track"></div>
  </div>
</section>

<footer class="tienda-footer">
  <a href="https://wa.me/595981751066" class="footer-link" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 11.5a8 8 0 1 1-3.6-6.7L20 4l-1 3.5a8 8 0 0 1 1 4z"></path>
      <path d="M8.5 9.5c.3 2.5 2.5 4.7 5 5"></path>
    </svg>
    <span>WhatsApp</span>
  </a>
  <a href="https://instagram.com/buttons_py" class="footer-link" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect>
      <circle cx="12" cy="12" r="4"></circle>
      <circle cx="17" cy="7" r="0.8" fill="currentColor" stroke="none"></circle>
    </svg>
    <span>@buttons_py</span>
  </a>
  <p class="footer-note">— presioná una opción ✦</p>
</footer>

<script src="productos-data.js"></script>
<script src="tienda.js"></script>
<script src="transitions.js"></script>

</body>
</html>
