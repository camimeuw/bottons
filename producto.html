<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons — Producto</title>
  <style>:root{--page-bg:#ffffff;}</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tienda.css">
</head>
<body class="tienda-body producto-body">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="thin-logo">
      <feMorphology operator="erode" radius="0.28"></feMorphology>
    </filter>
  </defs>
</svg>

<header class="producto-top">
  <a href="tienda.html" class="producto-back">← volver a la tienda</a>
</header>

<main id="producto-page" class="producto-page"></main>

<!-- CARRITO -->
<button id="carrito-btn" class="carrito-icono" type="button" aria-label="Ver carrito">
  <img src="assets/img/carrito-boton-2.png" alt="" class="carrito-icono-img">
  <span class="carrito-contador" id="carrito-contador">0</span>
</button>
<div class="carrito-overlay" id="carrito-overlay"></div>
<aside class="carrito-panel" id="carrito-panel">
  <div class="carrito-header">
    <h3 class="carrito-titulo">✦ mi carrito ♡</h3>
    <button class="carrito-cerrar" id="carrito-close" type="button">✕</button>
  </div>
  <div class="carrito-items" id="carrito-items">
    <p class="carrito-vacio">tu carrito está vacío ✦</p>
  </div>
  <div class="carrito-footer">
    <p class="carrito-total">total: <span id="carrito-total">$0</span></p>
    <button class="carrito-comprar" id="carrito-comprar" type="button">enviar pedido ♡</button>
  </div>
</aside>

<footer class="tienda-footer">
  <a href="https://wa.me/595981751066" class="footer-link" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 11.5a8 8 0 1 1-3.6-6.7L20 4l-1 3.5a8 8 0 0 1 1 4z"></path>
      <path d="M8.5 9.5c.3 2.5 2.5 4.7 5 5"></path>
    </svg>
    <span>WhatsApp</span>
  </a>
  <a href="https://instagram.com/buttons_py" class="footer-link" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect>
      <circle cx="12" cy="12" r="4"></circle>
      <circle cx="17" cy="7" r="0.8" fill="currentColor" stroke="none"></circle>
    </svg>
    <span>@buttons_py</span>
  </a>
</footer>

<script src="productos-data.js"></script>
<script src="carrito.js"></script>
<script src="producto.js"></script>
<script src="transitions.js"></script>

</body>
</html>
